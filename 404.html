  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1a1f;
      --surface: #2c2b30;
      --gold: #c9a96e;
      --gold-light: #e0c891;
      --text: #f5f5f5;
      --text-muted: #a0a0a0;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-container {
      max-width: 560px;
      animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .error-desc {
      color: var(--text-muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .error-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .error-links a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--bg);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,169,110,0.3); }
    .btn-outline {
      border: 1px solid rgba(201,169,110,0.3);
      color: var(--gold);
    }
    .btn-outline:hover { background: rgba(201,169,110,0.1); border-color: var(--gold); }
    .contact-info {
      color: var(--text-muted);
      font-size: 0.85rem;
      line-height: 1.8;
    }
    .contact-info a {
      color: var(--gold);
      text-decoration: none;
    }
    .contact-info a:hover { text-decoration: underline; }
    .brand {
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .brand strong { color: var(--gold); }
  </style>
</head>

      or email <a href="mailto:ssbuilders1113@gmail.com">ssbuilders1113@gmail.com</a>

</body>
</html>
